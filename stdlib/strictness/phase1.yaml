# Faz 1 şema sıkılığı (G-27). v1'de zorunlu olup eski sistemde zorunlu olmayan alanlar.
# Bu listedeki 'required' hataları yükleyiciyi durdurmaz; view.warnings'e düşer, `mekanik check` UYARI gösterir.
# Faz 2'de (şema 1.1) liste boşalır. Biçim: kind → zorunlu alan adları; iç içe alan 'a/*/b' (liste öğesi *).
version: 1
required_later:
  work: [work_type, packages, stdlib, org, project, schema_version, kind, purpose, done_criterion, opened_at]
  decision: [category, requirement_effects, options, rationale, work, schema_version, kind, opened_at, chosen,
             approved_version, basis/*/at]
  approval: [signature, channel, role, commit, work, schema_version, kind]
  card: [explain, visuals, work, schema_version, kind, opened_at, opened_by, level, triggers]
  # Eski hesapta AMAC boş olabilirdi, yöntem ve kod commit'i yoktu; hata veren analizin kaydı BAGLANTI'sızdı.
  calculation: [purpose, method, code, links, scenario]
