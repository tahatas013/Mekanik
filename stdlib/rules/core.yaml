# Çekirdek kuralları (phase-1 guide §8.1). Biçim: rules: [{id, text, limit, limit_source, level, basis, check}].
# Dayanağı olmayan kural buraya girmez (el kitabı §9). `check`: kuralı uygulayan kontrolün kimliği; nokta içermeyen
# kimlik çekirdektir (paket kontrolleri `<paket>.<ad>`). Koddaki eşik `limit`te durur, kod buradan okur.
# Eski katalog: surec kurallar/katalog.yaml v0 (2026-10-26).
rules:
  - id: SOURCE-01
    text: Her değerin bir kaynak etiketi vardır; etiketsiz değer model üretmez.
    limit: >-
      source ∈ {measured:<alet>, standard:*, regulation:*, customer:*, manufacturer:*, literature:*, decision,
      derived, assumption}
    limit_source: null
    level: her aşamada ENGEL
    basis: ["el kitabı §1 ilke 1, §9, §10", "H-001 kök neden 2", "eski KAYNAK-01"]
    check: source

  - id: UNCERT-01
    text: >-
      Kritik bir ölçüde ölçme belirsizliği tolerans bandının dörtte birini aşmaz; yalnız biçim için geçerli
      ölçme aleti (valid_for.critical_dimension = false) kritik ölçüde kullanılmaz.
    limit: {ratio: 4}
    limit_source: "standard:ANSI/NCSL Z540.3 (4:1)"
    level: keşif ve geliştirmede UYARI, kesinleştirmede ENGEL
    basis: ["ISO 14253-1", "ANSI/NCSL Z540.3 (4:1)", "JCGM 100 (GUM)", "el kitabı §9", "H-001 ek bulgu",
            "Yanchuk vd., Geodetski vestnik 70/1", "eski OLCU-01, OLCU-02"]
    check: uncertainty

  - id: APPROVAL-01
    text: Serbest bırakmada açık DUR, kapanmamış ya da reddedilmiş kart, incelenmemiş karar ve bayat onay yoktur.
    limit: "açık DUR = 0; incelenmemiş karar = 0; bayat onay = 0"
    limit_source: null
    level: kesinleştirmede ENGEL (öncesinde uygulanmaz)
    basis: ["el kitabı §10 serbest bırakma koşulu", "ISO 9001 madde 8.3", "eski ONAY-01"]
    check: approval_state

  - id: APPROVAL-02
    text: >-
      Her onay kaydı, baş mühendisin atölye ayarındaki imza anahtarıyla (SSH ya da GPG) imzalı bir commit'le
      gelir; imzasız, başka anahtarla imzalı ya da baş mühendis kimliği dışında verilmiş onay geçersizdir.
    limit: "imza durumu iyi (G/U) ve parmak izi = identities.chief_signing_key"
    limit_source: null
    level: her aşamada ENGEL
    basis: ["architecture §4.6 onay güvenliği", "kalite bulgusu KM-04", "Ek A onay.py:112 ilk-ad hatası"]
    check: approval_signature

  - id: DECISION-02
    text: İstek listesi olan çalışmada karar kartının "isteklere etkisi" boş olamaz.
    limit: "requirement_effects ≥ 1 madde"
    limit_source: null
    level: her aşamada ENGEL
    basis: ["bağımsız inceleme B8", "eski kartlar.eksikler (hedef_etkisi)"]
    check: decision_effects

  - id: CARD-01
    text: >-
      Açık kartın sorusu, "bu nedir" açıklaması, önerisi ve gerekçesi, onaylarsan/reddedersen/kayda geçer kutuları
      ve görseli vardır; metni ya da görseli eksik kart açılamaz.
    limit: "eksik alan = 0"
    limit_source: null
    level: her aşamada ENGEL
    basis: ["kart standardı (Ö-09 … Ö-14, Ö-27)", "Ö-10", "eski kartlar.eksikler"]
    check: card_standard

  - id: SCHEMA-01
    text: >-
      v1'de zorunlu olup eski sistemde zorunlu olmayan alanın eksikliği Faz 1'de yükleyiciyi durdurmaz, UYARI
      olarak gösterilir (liste stdlib/strictness/phase1.yaml).
    limit: null
    limit_source: null
    level: UYARI
    basis: ["phase-1 guide G-27"]
    check: schema

  # Faz 2 güvence kuralları (mimari §4.7 "yeni", §10.1–§10.3, §10.6; dalga 2.1 · P).
  - id: SOURCE-02
    text: >-
      Model ve hesap kodunda (model/*.py, calcs/*.py) izin listesi dışındaki her sayısal sabit params.yaml'dan ya da
      kaynaklı const() ile gelir. const() argümanları, magnitude() yöntem düzeyi ve tamsayı indisler sayılmaz.
    limit: {allowed: [0, 1, 2, 0.5, 90, 180, 360]}
    limit_source: "assumption — mimari §10.1 izin listesi (öneri; baş mühendis onayıyla değişir)"
    level: "keşif ve geliştirmede UYARI, kesinleştirmede ENGEL (F3: serbest bırakmada 0)"
    basis: ["mimari §10.1", "kabul ölçütü F3", "Ek B bulgu 2"]
    check: source_code

  - id: CALC-03
    text: >-
      Kritik hesap (zorunlu isteğin kanıtı, DUR kararının dayanağı, güvenlik kritik değerle beslenen ya da kritik
      işaretli) aynı büyüklüğü bağımsız ikinci bir yöntemle bildirir ve ikisi sınır içinde uyuşur. Bağımsız: başka
      yöntem düzeyi, ya da başka yöntem ve ortak türetilmiş girdi yok; biri öbürünün kaydını okumaz. İkinci yöntem
      yoksa ya da uyuşmuyorsa ENGEL: hesaba dayanan karar onaylanamaz; uyuşmazlıkta kapı isteği açılmaz.
    limit: {relative: 0.10, magnitudes: {}}
    limit_source: >-
      decision — bağıl %10 (eski HESAP-01; Ö-22, el kitabı onayıyla T-23, 2026-11-06); büyüklük başına
      `magnitudes.<ad>` ile değiştirilebilir (mimari §10.2)
    level: her aşamada ENGEL
    basis: ["mimari §10.2", "Ö-18", "Ö-22", "KM-11", "E-30"]
    check: calc_cross_check

  - id: CALC-04
    text: >-
      Kanıt ya da karar dayanağı olan hesap geçerlilik alanı dışındaysa kanıt olamaz; dış değerleme (yalnız sınırlar)
      baş mühendisin placard onayı ister; yalnız doğrulama alanı ve tanımsız alan uyarıdır. Her sonuç belirsizlik
      beyanı taşır (nicel, nitel ya da 'tahmin yok').
    limit: "alan dışı = 0; onaysız dış değerleme = 0; beyansız sonuç = 0"
    limit_source: null
    level: her aşamada ENGEL (doğrulama alanı ve tanımsız alan UYARI)
    basis: ["mimari §10.3", "NASA-STD-7009B [M&S 26], [M&S 33]", "E-39"]
    check: calc_validity

  - id: REQ-01
    text: >-
      G4 ve G5'te zorunlu isteklerin hepsi kanıtla "karşılandı"dır; karşılanmamış ya da kanıt bekleyen zorunlu istek
      varken kapı geçilmez. Durum kanıttan türetilir; CALC-03/CALC-04'ün reddettiği kanıt sayılmaz.
    limit: {gates: [G4, G5]}
    limit_source: "decision — mimari §10.6, kabul ölçütü F5 (Faz 2)"
    level: G4 ve G5'te ENGEL (öncesinde uygulanmaz)
    basis: ["mimari §10.6", "bağımsız inceleme B2", "kabul ölçütü F5"]
    check: requirements_met

  # Dalga 2.2 · W (kalite bulgusu KM-19; mimari §8.1).
  - id: MAINDIM-01
    text: >-
      Ana ölçü işaretini (params.yaml `main_dimension`) yalnız baş mühendis koyar ya da kaldırır (`mekanik value
      --main`): bir parametrenin işareti, baş mühendisin o parametreyi değiştiren son imzalı commit'indeki hâlidir.
      Ekip commit'iyle (ya da kaydedilmemiş değişiklikle) konan ya da kaldırılan işaret, geri alınana ya da baş
      mühendis imzalayana kadar ENGEL'dir; ekip DUR kapsamını belirleyemez.
    limit: null
    limit_source: null
    level: her aşamada ENGEL
    basis: ["mimari §8.1", "KM-19", "common#quantity.main_dimension", "kesin karar 1 madde 7"]
    check: main_dimension
