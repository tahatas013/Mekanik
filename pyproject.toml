[project]
name = "mekanik"
version = "0.1.0.dev0"
description = "Tasarım ve mühendislik süreç sistemi: çekirdek, CLI, Claude Code eklentisi"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "mcp>=1.2",
    "pyyaml>=6.0.3",
    "referencing>=0.36",
    "rfc3339-validator>=0.1.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
mech = ["mekanik-mech"]
print3d = ["mekanik-print3d"]
analysis = ["mekanik-analysis"]
all = ["mekanik-mech", "mekanik-print3d", "mekanik-analysis"]

[project.scripts]
mekanik = "mekanik.cli.main:main"

[project.entry-points."mekanik.packages"]
core = "mekanik.core.builtin:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekanik"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "mekanik/_data/schemas"
"stdlib" = "mekanik/_data/stdlib"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mekanik-mech = { workspace = true }
mekanik-print3d = { workspace = true }
mekanik-analysis = { workspace = true }

[dependency-groups]
test = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "pytest>=8.3",
]
# Workspace packages. OCCT-free core run (criterion 1.10):
#   UV_PROJECT_ENVIRONMENT=.venv-core uv run --no-group pkgs pytest tests/core
pkgs = ["mekanik-mech", "mekanik-print3d", "mekanik-analysis"]

[tool.uv]
default-groups = ["test", "pkgs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["occt: OCCT (CadQuery) gerektirir"]

[tool.importlinter]
root_packages = ["mekanik", "mekanik_mech", "mekanik_print3d", "mekanik_analysis"]

[[tool.importlinter.contracts]]
name = "Çekirdek paketleri içe aktarmaz"
type = "forbidden"
source_modules = ["mekanik"]
forbidden_modules = ["mekanik_mech", "mekanik_print3d", "mekanik_analysis"]

[[tool.importlinter.contracts]]
name = "mech yalnız çekirdeği bilir"
type = "forbidden"
source_modules = ["mekanik_mech"]
forbidden_modules = ["mekanik_print3d", "mekanik_analysis"]
