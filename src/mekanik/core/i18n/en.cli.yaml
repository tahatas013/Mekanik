# UI text of the `mekanik` command line (mekanik.cli). Key prefix: cli. Owner: wave 3 · E2. Missing keys fall back to TR.
cli:
  description: "Design and engineering process system"
  error: "ERROR: {error}"
  default_subject: "interim review"
  help:
    doctor: "checks the environment: tools, versions, identities, signature confirmation, disk, packages, smoke test"
    regress: "runs every error case"
    check: "runs the checks (writes no file); short Markdown or JSON"
    work: "works: open, continue, close, archive"
    work_new: "gives the code, opens the main line and the work branch, writes work.yaml and the skeleton"
    work_open: "prepares the worktree and prints the terminal command that opens the session (at most 3 active)"
    work_close: "ends the work's open agent sessions; nothing is deleted"
    work_attach: "switches to the work's tmux session (optional tmux adapter)"
    work_archive: "archives the work: tag, archive.yaml record, worktree to the archive; deletes nothing"
    step: "records a step: calculations, checks, cards, commit, model cache, log"
    stage: "stage"
    stage_finish: "runs the gate checklist, opens the chief engineer's approval card (hold)"
    release: "release"
    release_request: "release request (hold): prepares the files, opens the B card; on approval a tag and out/"
    gate: "gate"
    gate_pass: "chief engineer: approves the gate card (interactive terminal, signed)"
    approve: "chief engineer: approves, rejects, comments on or undoes a card (interactive terminal, signed)"
    reply: "team: answers the chief engineer's comment (after the step that acts on it)"
    pending: "the chief engineer's comments awaiting a reply"
    decide: "opens a decision record; a branched decision puts each option on its own branch"
    agent: "agent sessions"
    agent_hook: "Claude Code hook: session status, data gate, block list (stdin JSON)"
    agent_status: "status of the agent sessions"
    watch: "watches the chief engineer's approval and comment commits; one line each (wakes the team)"
    review: "quality engineer review"
    review_prompt: "prints the review prompt (frozen copy); given as is to the quality-engineer subagent"
    review_record: "writes the subagent's findings (stdin) under records/quality/"
    review_close: "closes a quality finding with its rationale and the regression answer"
    pulse: "the team is working on this work, or stopped (the panel's indicator)"
    migrate: "migration of old surec data to v1 (dry run)"
    migrate_surec-config: "organizations, manufacturing and measuring profiles → workshop config"
    migrate_surec-work: "old work folder → v1 files and the migration report (V1–V8)"
    pkg: "packages"
    pkg_list: "lists the installed packages"
    verify: "checks the signature of every approval record (APPROVAL-02)"
  arg:
    work: "work code or folder (default: the work you are in)"
    json: "JSON output"
    done: "done criterion"
    class: "risk class (from the process profile)"
    card: "card id"
    title: "title"
    text: "description or reply text"
    role: "role"
    action: "approve, reject, comment or undo"
    rationale: "rationale"
    concept: "concept decision (the G1 checklist looks for one with at least three options)"
    gate: "gate (G0 … G5, from the process profile)"
    visual: "figure file (repeatable)"
    event: "Claude Code hook event (SessionStart, PreToolUse …)"
    note: "note or reason (required for undo)"
    option: "option approved on a decision card; on decide id:title (repeatable)"
    row: "row approved on the assumption list (param name; repeatable)"
    comment: "time of the comment answered (default: the card's oldest unanswered one)"
    next: "the next job (work.yaml next_step; shown on the panel's status screen)"
    commit: "the step that acts on it (default HEAD)"
    hook: "Claude Code hook output (JSON); silent where data transfer is forbidden"
    definition: "card text and detailed options: a YAML file (question, explain, proposal, options …)"
    dependent: "dependent work (repeatable)"
    plain: "plain decision: no branches"
    doing: "what is being done now"
    stopped: "the team stopped; why (e.g. 'waiting for decision K-02')"
    case: "a regression case is needed: where it is"
    no_case: "no regression case is needed: why not"
    snapshot: "old-side snapshot (output of tests/migrate/old_probe.py); for V4–V8"
    out: "folder of the new files (default: a temporary folder)"
    apply: "real migration (phase 2)"
  action:
    approve: "approval"
    reject: "rejection"
    comment: "comment"
    undo: "undo"
  signing_key: "chief engineer's signing key (workshop config, identities.chief_signing_key): {fp} — stop if it is not yours"
  approve:
    tty: "mekanik approve runs only from the chief engineer's interactive terminal (or the panel)"
    confirm: "A '{action}' record for {card} will be written as {who}. Type the card id to confirm: "
    cancelled: "Cancelled."
    undo_note: "give the reason for the undo with --note"
  check:
    head: |-
      ## Checks · {code} · {stage}

      **{block} BLOCK · {warn} WARN · {pass} PASS** · profile {profile}

      | Status | Check | Ref | Reason |
      | --- | --- | --- | --- |
    open: "\nOpen cards: {n} — {items}"
  work:
    new: "{code} opened · worktree {path} · branch {branch}"
    close: "{code}: {n} sessions ended; worktree and branches kept"
  step: "{sha} · {block} BLOCK · {warn} WARN · {pass} PASS · cards: {cards}"
  stage_finish: "Card O-{gate} opened; the gate waits for the chief engineer's approval (hold)."
  release: "Card B-{no} opened (hold). Files: {folder}"
  reply: "{card} · comment of {at} answered"
  pending:
    none: "No comment awaits a reply."
    hook: "The chief engineer's comments awaiting a reply (act on them, then `mekanik reply <card> --text \"...\"`):"
  decide:
    no_option: "no option (--option or --definition)"
    opened: "{id} opened · {options}"
    no_branch: "no branch"
  run_status:
    running: "running"
    waiting_input: "waiting for input"
    waiting_permission: "waiting for permission"
    finished: "finished"
    failed: "failed"
    interrupted: "interrupted"
  review:
    recorded: "{name}: {n} findings, {high} open HIGH"
    closed: "{no} closed: {note}"
    severity:
      high: "HIGH"
      medium: "MEDIUM"
      low: "LOW"
  migrate:
    done: "{n} migration gaps · {out}"
    no_snapshot: "V4–V8 need the old-side snapshot (--snapshot; tests/migrate/old_probe.py)"
  pkg: "{id:<10} {version:<10} {checks} checks"
  verify:
    summary: "{n} approval records · {bad} invalid"
  doctor:
    status:
      ok: "OK"
      pending: "PENDING"
      warn: "WARN"
      error: "ERROR"
    group:
      tool: "tool"
      identity: "identity"
      disk: "disk"
      package: "package"
      smoke: "smoke"
    item:
      config: "workshop config"
      chief: "chief engineer"
      team: "team"
      signing_key: "approval signature"
      free_space: "free space"
      model_cache: "model cache"
      registry: "package registry"
      model: "model → STEP"
    result: "\nResult: {verdict} · {error} ERROR · {warn} WARN · {pending} PENDING"
    green: "GREEN"
    red: "RED"
    not_installed: "not installed"
    optional: "not installed; optional (mekanik does not install it)"
    too_old: "{found} (needs at least {need})"
    gpg_key: >-
      {fp}: a GPG key; gpg-agent has no per-use confirmation, so an agent could sign unseen.
      The chief engineer's key must be SSH, added with ssh-add -c (T-17 (b), §4.6)
    unchecked: "{fp}: could not be checked (no ssh-add or ssh-keygen)"
    not_in_agent: "{fp}: not in ssh-agent (add it with ssh-add -c)"
    no_pub: "{fp}: not among the agent's public keys"
    trial: "Trial signature: a confirmation window will appear on the desktop; REFUSE it."
    trial_refused: "{fp}: the trial signature could not be made unconfirmed (per-use confirmation works)"
    trial_signed: "{fp}: the agent signed without the window being refused (needs ssh-add -c)"
    free: "{free:.1f} GB free (lower limit {min:.0f} GB)"
    cache: "{n} entries, {used:.2f} GB / {limit:.0f} GB · {root}"
    no_model: "no model package installed (mech)"
    smoke: "cube: volume {volume:.3f} mm³, {faces} faces, STEP {size} bytes, tessellation"
