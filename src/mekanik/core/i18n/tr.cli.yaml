# `mekanik` komut satırının arayüz metinleri (mekanik.cli). Anahtar öneki: cli. Sahibi: dalga 3 · E2.
cli:
  description: "Tasarım ve mühendislik süreç sistemi"
  error: "HATA: {error}"
  default_subject: "ara inceleme"
  help:
    doctor: "ortamı denetler: araçlar, sürümler, kimlikler, imza onayı, disk, paketler, duman testi"
    regress: "bütün hata vakalarını çalıştırır"
    check: "kontrolleri çalıştırır (dosya yazmaz); sonuç kısa Markdown ya da JSON"
    work: "çalışmalar: aç, sürdür, kapat, arşivle"
    work_new: "kodu verir, ana hattı ve iş dalını açar, work.yaml ve iskeleti oluşturur"
    work_open: "worktree'yi hazırlar ve oturumu açan terminal komutunu yazar (en çok 3 etkin çalışma)"
    work_close: "çalışmanın açık ajan oturumlarını kapatır; hiçbir şey silinmez"
    work_attach: "çalışmanın tmux oturumuna geçer (isteğe bağlı tmux adaptörü)"
    work_archive: "çalışmayı arşive alır: etiket, archive.yaml kaydı, worktree arşive; silmez"
    step: "adımı kaydeder: hesaplar, kontroller, kartlar, commit, model önbelleği, günlük"
    stage: "aşama"
    stage_finish: "kapı kontrol listesini çalıştırır, baş mühendis onay kartını (Dur) açar"
    release: "baskı"
    release_request: "baskı isteği (Dur): dosyaları hazırlar, B kartını açar; onayla etiket ve out/"
    gate: "kapı"
    gate_pass: "baş mühendis: kapı kartını onaylar (etkileşimli terminal, imzalı)"
    approve: "baş mühendis: kartı onaylar, reddeder, yorum yazar ya da geri alır (etkileşimli terminal, imzalı)"
    reply: "ekip: baş mühendisin yorumunu yanıtlar (gereğini yapan adımdan sonra)"
    pending: "baş mühendisin yanıt bekleyen yorumları"
    decide: "karar kaydı açar; dallı kararda her seçenek ayrı dalda"
    agent: "ajan oturumları"
    agent_hook: "Claude Code kancası: oturum durumu, veri kapısı, engel listesi (stdin JSON)"
    agent_status: "ajan oturumlarının durumu"
    watch: "baş mühendisin onay ve yorum commit'lerini izler; her biri bir satır (ekibi uyandırır)"
    review: "kalite mühendisi incelemesi"
    review_prompt: "inceleme istemini üretir (donmuş kopya); quality-engineer alt ajanına olduğu gibi verilir"
    review_record: "alt ajanın bulgularını (stdin) records/quality/ altına yazar"
    review_close: "kalite bulgusunu gerekçesi ve regresyon yanıtıyla kapatır"
    pulse: "ekip bu çalışmada çalışıyor ya da durdu (panelin göstergesi)"
    migrate: "eski surec verisinin v1'e taşınması (kuru çalıştırma)"
    migrate_surec-config: "kurumlar, üretim ve ölçüm profilleri → atölye ayarı biçimi"
    migrate_surec-work: "eski çalışma klasörü → v1 dosyaları ve taşıma raporu (V1–V8)"
    pkg: "paketler"
    pkg_list: "yüklü paketleri listeler"
    verify: "bütün onay kayıtlarının imzasını denetler (APPROVAL-02)"
  arg:
    work: "çalışma kodu ya da klasörü (yoksa bulunduğun çalışma)"
    json: "JSON çıktı"
    done: "bitti ölçütü"
    class: "risk sınıfı (süreç profilinden)"
    card: "kart numarası"
    title: "başlık"
    text: "açıklama ya da yanıt metni"
    role: "rol"
    action: "onay, ret, yorum ya da geri alma"
    rationale: "gerekçe"
    concept: "kavram kararı (G1 listesi en az üç seçenekli kavram kararı arar)"
    gate: "kapı (G0 … G5, süreç profilinden)"
    visual: "görsel dosyası (birden çok verilebilir)"
    event: "Claude Code kanca olayı (SessionStart, PreToolUse …)"
    note: "not ya da gerekçe (geri almada zorunlu)"
    option: "karar kartında onaylanan seçenek; kararda ad:açıklama (birden çok)"
    row: "varsayım listesinde onaylanan satır (param adı; birden çok)"
    comment: "yanıtlanan yorumun zamanı (yoksa kartın en eski yanıtlanmamış yorumu)"
    commit: "gereğini yapan adım (varsayılan HEAD)"
    hook: "Claude Code kancası çıktısı (JSON); veri aktarımı yasak kurumda sessiz"
    definition: "kart metni ve ayrıntılı seçenekler: YAML dosyası (question, explain, proposal, options …)"
    dependent: "bağımlı iş (birden çok)"
    plain: "dalsız karar: dal açılmaz"
    doing: "şu an yapılan iş"
    stopped: "ekip durdu; nedeni (ör. 'K-02 kararını bekliyor')"
    case: "regresyon vakası gerekiyor: vakanın yeri"
    no_case: "regresyon vakası gerekmiyor: gerekçesi"
    snapshot: "eski taraf görüntüsü (tests/migrate/old_probe.py çıktısı); V4–V8 için"
    out: "yeni dosyaların klasörü (yoksa geçici klasör)"
    apply: "gerçek taşıma (Faz 2)"
  action:
    approve: "onay"
    reject: "ret"
    comment: "yorum"
    undo: "geri alma"
  approve:
    tty: "mekanik approve yalnız baş mühendisin etkileşimli terminalinden çalışır (panelden de verilebilir)"
    confirm: "{card} için '{action}' kaydı {who} kimliğiyle yazılacak. Onaylamak için kart numarasını yaz: "
    cancelled: "Vazgeçildi."
    undo_note: "geri almanın nedenini --note ile yaz"
  check:
    head: |-
      ## Kontroller · {code} · {stage}

      **{block} ENGEL · {warn} UYARI · {pass} GEÇTİ** · profil {profile}

      | Durum | Kontrol | Ref | Neden |
      | --- | --- | --- | --- |
    row: "| {status} | {check} | {ref} | {reason} |"
    open: "\nAçık kartlar: {n} — {items}"
  regress:
    case: "{case}: {ok}/{n}"
    sub: "  {mark} {id:<3} {text}"
    error: "        {error}"
  work:
    new: "{code} açıldı · worktree {path} · dal {branch}"
    open: "{code}: {path}\n{command}"
    close: "{code}: {n} oturum kapandı; worktree ve dallar yerinde"
  step: "{sha} · {block} ENGEL · {warn} UYARI · {pass} GEÇTİ · kartlar: {cards}"
  item: "  {mark} {text}"
  stage_finish: "O-{gate} kartı açıldı; geçiş baş mühendis onayını bekliyor (Dur)."
  release: "B-{no} kartı açıldı (Dur). Dosyalar: {folder}"
  reply: "{card} · {at} yorumu yanıtlandı"
  pending:
    row: "{card:<8} {at}  {text}"
    none: "Yanıt bekleyen yorum yok."
    hook: "Baş mühendisin yanıt bekleyen yorumları (gereğini yap, sonra `mekanik reply <kart> --text \"...\"`):"
    hook_row: "- {card} · {at} · {text}"
  decide:
    no_option: "seçenek yok (--option ya da --definition)"
    opened: "{id} açıldı · {options}"
    branch: "{id} → {branch}"
    no_branch: "dal yok"
  status: "{work:<12} {status:<18} {at}  {id}"
  run_status:
    running: "çalışıyor"
    waiting_input: "cevap bekliyor"
    waiting_permission: "izin bekliyor"
    finished: "bitti"
    failed: "hata"
    interrupted: "kesildi"
  pulse: "{work}: {status} · {doing} ({at})"
  review:
    finding: "{no} [{severity}] {location} — {problem}"
    recorded: "{name}: {n} bulgu, {high} açık YÜKSEK"
    closed: "{no} kapandı: {note}"
    severity:
      high: "YÜKSEK"
      medium: "ORTA"
      low: "DÜŞÜK"
  migrate:
    row: "{v}  {status:<10} {detail}"
    done: "{n} taşıma eksiği · {out}"
    no_snapshot: "V4–V8 için eski taraf görüntüsü gerekir (--snapshot; tests/migrate/old_probe.py)"
  pkg: "{id:<10} {version:<10} {checks} kontrol"
  verify:
    row: "{status:<7} {card:<8} {action:<8} {at}  {reason}"
    summary: "{n} onay kaydı · {bad} geçersiz"
  doctor:
    status:
      ok: "TAMAM"
      pending: "BEKLİYOR"
      warn: "UYARI"
      error: "HATA"
    group:
      tool: "araç"
      identity: "kimlik"
      disk: "disk"
      package: "paket"
      smoke: "duman"
    item:
      config: "atölye ayarı"
      chief: "baş mühendis"
      team: "ekip"
      signing_key: "onay imzası"
      free_space: "boş alan"
      model_cache: "model önbelleği"
      registry: "paket kaydı"
      model: "model → STEP"
    row: "{status}  {group:<8} {name:<20} {detail}"
    result: "\nSonuç: {verdict} · {error} HATA · {warn} UYARI · {pending} BEKLİYOR"
    green: "YEŞİL"
    red: "KIRMIZI"
    not_installed: "kurulu değil"
    optional: "kurulu değil; isteğe bağlı (mekanik kurmaz)"
    too_old: "{found} (en az {need} gerekir)"
    gpg_key: "{fp}: GPG anahtarı; kullanım başına onay (ssh-add -c, T-17 (b)) SSH anahtarı ister"
    unchecked: "{fp}: denetlenemedi (ssh-add ya da ssh-keygen yok)"
    not_in_agent: "{fp}: ssh-agent'ta yok (ssh-add -c ile eklenir)"
    no_pub: "{fp}: ajandaki açık anahtarlarda bulunamadı"
    trial: "Deneme imzası: masaüstünde onay penceresi çıkacak; REDDET."
    trial_refused: "{fp}: deneme imzası onaysız atılamadı (kullanım başına onay var)"
    trial_signed: "{fp}: ajan onay penceresi reddedilmeden imza attı (ssh-add -c gerekir)"
    free: "{free:.1f} GB boş (alt sınır {min:.0f} GB)"
    cache: "{n} giriş, {used:.2f} GB / {limit:.0f} GB · {root}"
    no_model: "model paketi yüklü değil (mech)"
    smoke: "küp: hacim {volume:.3f} mm³, {faces} yüz, STEP {size} bayt, tessellation"
