# Panel arka ucu, gelen kutusu ve MCP sunucusunun arayüz metinleri (mekanik.panel, mekanik.agent.inbox, mekanik.agent.mcp).
# Anahtar öneki: panel. Dosya sahipliği gereği bu dosyada duran üç agent.* anahtarı panel sırrı, oturum kilidi ve
# çalışma klasöründeki ajan dosyaları içindir (claude_code.yaml engel listesi); tr.agent.yaml'a taşınabilir.
agent:
