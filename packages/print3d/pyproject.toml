[project]
name = "mekanik-print3d"
version = "0.1.0.dev0"
description = "3B baskı paketi: FDM profil türü, tabla kontrolleri, baskı isteği"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["mekanik", "mekanik-mech"]

[project.entry-points."mekanik.packages"]
print3d = "mekanik_print3d:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekanik_print3d"]

[tool.uv.sources]
mekanik = { workspace = true }
mekanik-mech = { workspace = true }
