[project]
name = "mekanik-analysis"
version = "0.1.0.dev0"
description = "Analiz paketi: hesap şablonları, FEA"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["mekanik", "numpy", "scikit-fem>=12.0.2", "tetgen>=0.8.4", "trimesh>=5.2.0"]

[project.entry-points."mekanik.packages"]
analysis = "mekanik_analysis:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekanik_analysis"]

[tool.uv.sources]
mekanik = { workspace = true }
