[project]
name = "mekanik-mech"
version = "0.1.0.dev0"
description = "Mekanik CAD paketi: geçme kaydı, parametrik model, mekanik kontroller, görünüşler"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["mekanik", "cadquery>=2.8.0", "manifold3d>=3.5.4", "numpy", "ocp-tessellate>=3.6.3", "trimesh>=5.2.0"]

[project.entry-points."mekanik.packages"]
mech = "mekanik_mech:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekanik_mech"]

[tool.uv.sources]
mekanik = { workspace = true }
